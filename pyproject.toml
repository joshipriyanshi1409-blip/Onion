[project]
name = "pyaazscan"
version = "0.1.0"
description = "AI-assisted onion procurement inspection demo — FastAPI modular monolith serving a static frontend."
requires-python = ">=3.10"
# Runtime dependencies. Vercel installs from this manifest (preferring it over
# requirements.txt when both exist), so every runtime dependency must be
# declared here. requirements.txt mirrors this list plus test-only tooling for
# Docker and local development; tests/test_deployment.py guards the parity.
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "python-multipart>=0.0.9",
    "Pillow>=10.0,<13",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "reportlab>=4.0,<5",
    "qrcode[pil]>=7.4,<9",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Test tooling only — keep it out of the serverless bundle.
# These are also included in requirements.txt for local development.
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
]
# Optional model training/export (not installed on Vercel): pip install ultralytics onnx
training = [
    "ultralytics>=8.3,<9",
    "onnx>=1.16,<2",
]

[tool.uv]
# This repo is an application run in place (uvicorn backend.main:app), not a
# packaged library, so uv must treat it as a virtual project and never build it.
package = false

[tool.vercel]
# The FastAPI app lives in a package module rather than a default root entrypoint.
entrypoint = "backend.main:app"
