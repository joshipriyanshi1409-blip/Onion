    <text x="72" y="98" font-size="18" font-weight="700" letter-spacing="3">PYAazScan</text>
    <text x="72" y="129" font-size="11" font-weight="700" letter-spacing="2" fill="#b87534">ONION QUALITY SCAN</text>
    <text x="72" y="188" font-size="12" font-weight="700" letter-spacing="1.5">50 mm calibration reference</text>
    <text x="72" y="211" font-size="10" fill="#748278">Print at 100% / actual size. Verify the square with a ruler.</text>
    <text x="72" y="273" font-size="9" font-weight="700" letter-spacing="1.5" fill="#748278">PLACE THE FLAT REFERENCE IN THE SAME PLANE AS THE BULBS</text>
